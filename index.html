<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b52"><title>Aplikasi IPA Pelayanan Kefarmasian Puskesmas</title>
<style>
:root{--n:#102b52;--n2:#24517f;--gold:#d9b76e;--bg:#f2f5fa;--ink:#1a2b42;--mut:#65768c;--line:#dce4ee;--red:#b42318;--green:#18794e}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.top{background:var(--n);color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:12px;background:#234873;color:var(--gold);display:grid;place-items:center;font-weight:900}.title{font-weight:800}.sub{font-size:11px;color:#cbd8e8;margin-top:3px}.wrap{max-width:1400px;margin:auto;padding:16px}.nav,.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.nav button{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--n);padding:10px 13px;font-weight:700}.nav button.active,.btn{background:var(--n);color:white}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:750}.btn.gold{background:var(--gold);color:#1a2b42}.btn.light{background:#e8eef7;color:var(--n)}.btn.red{background:#fff0ef;color:var(--red)}.head h1{margin:12px 0 5px;color:var(--n);font-size:24px}.muted{font-size:12px;color:var(--mut);line-height:1.5}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric{background:white;border:1px solid var(--line);border-radius:12px;padding:13px}.metric small{font-size:11px;color:var(--mut);font-weight:700}.metric b{display:block;font-size:25px;color:var(--n);margin:5px 0}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.field label{font-size:12px;font-weight:750}.field input,.field select,.tools input,.tools select{padding:10px;border:1px solid var(--line);border-radius:8px;min-width:0;background:white}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px}.sect{background:#eaf0f8;color:var(--n);font-size:13px;font-weight:850;padding:10px;border-radius:8px;margin:14px 0 5px}.attr{display:grid;grid-template-columns:35px minmax(180px,1fr) minmax(140px,200px) minmax(140px,200px);gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid #edf1f6}.no{font-weight:800;color:var(--mut);font-size:12px}.desc{font-size:13px;line-height:1.4}.rating label{display:flex;gap:3px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:5px;justify-content:center;font-size:11px;cursor:pointer}.rating{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.rating input{margin:0;accent-color:var(--n)}.rating label:has(input:checked){background:#e8eff9;border-color:#7897bd;color:var(--n);font-weight:800}.attrhead{display:grid;grid-template-columns:35px minmax(180px,1fr) minmax(140px,200px) minmax(140px,200px);gap:9px;color:var(--mut);font-size:10px;text-transform:uppercase;font-weight:800}.notice{padding:12px;border-radius:10px;background:#fff8e7;border:1px solid #efdfb3;color:#76580b;font-size:12px;line-height:1.5}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:760px;font-size:12px}th,td{text-align:left;padding:9px;border-bottom:1px solid #edf1f6;vertical-align:top}th{background:#f8fafd;color:#5c6d82;font-size:10px;text-transform:uppercase}.pill{display:inline-block;border-radius:99px;background:#eaf1fa;color:var(--n);padding:4px 7px;font-size:10px;font-weight:800}.bars{display:grid;gap:10px}.barrow{display:grid;grid-template-columns:minmax(110px,1fr) 2fr 45px;gap:8px;align-items:center;font-size:12px}.track{height:12px;background:#e9eef5;border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--n2)}.quadrants{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quad{padding:12px;border-radius:10px;min-height:120px}.q1{background:#fce8e6}.q2{background:#e2f3e8}.q3{background:#e8eff9}.q4{background:#fff1d6}.quad h3{margin:0 0 8px;font-size:13px}.quad p{font-size:11px;margin:0;line-height:1.5}.empty{text-align:center;padding:25px;color:var(--mut);font-size:13px}.footer{text-align:center;color:var(--mut);font-size:11px;padding:24px 0}.chart{display:grid;grid-template-columns:1fr;gap:10px}.plot{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:white}.small{font-size:11px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:repeat(2,1fr)}.attr,.attrhead{grid-template-columns:25px 1fr}.rating{grid-column:2;max-width:280px}.attrhead span:nth-child(3),.attrhead span:nth-child(4){display:none}.wrap{padding:10px}.top{padding:12px}.title{font-size:14px}}
@media(max-width:520px){.formgrid{grid-template-columns:1fr}.grid{gap:7px}.metric{padding:10px}.metric b{font-size:22px}.head h1{font-size:21px}.quadrants{grid-template-columns:1fr}.top{align-items:flex-start}.sub{max-width:210px}}
</style></head><body>
<header class="top"><div class="brand"><div class="logo">IPA</div><div><div class="title">IPA Pelayanan Kefarmasian Puskesmas</div><div class="sub">Aplikasi Pengumpulan Data & Analisis • Offline</div></div></div><div class="sub" style="text-align:right">apt. Fendy Prasetyawan, S.Farm., M.Farm.</div></header>
<div class="wrap"><nav class="nav" id="nav"></nav><main id="content"></main><div class="footer">Penyimpanan lokal browser • Gunakan kode responden anonim • Cadangkan data secara berkala</div></div>
<script>
const KEY="ipa_puskesmas_records_v1";
const D=[["A. Keandalan pelayanan",1,5],["B. Kecepatan dan ketepatan pelayanan",6,9],["C. Informasi obat",10,16],["D. Keramahan dan komunikasi petugas",17,21],["E. Kompetensi dan profesionalisme",22,25],["F. Ketersediaan dan kualitas obat",26,29],["G. Kenyamanan dan sarana pelayanan",30,34],["H. Kepuasan dan kepedulian terhadap pasien",35,40]];
const Q=["Petugas memberikan obat sesuai dengan resep yang diberikan","Petugas memberikan obat dengan jumlah yang sesuai","Petugas memberikan etiket obat dengan jelas","Petugas menyerahkan obat kepada pasien yang tepat","Pelayanan obat dilakukan secara tepat dan teratur","Waktu tunggu pelayanan obat tidak terlalu lama","Petugas segera memberikan pelayanan ketika pasien menyerahkan resep","Proses pelayanan resep berlangsung secara teratur","Petugas memberikan pelayanan sesuai urutan/prosedur","Petugas menjelaskan nama obat yang diberikan","Petugas menjelaskan kegunaan obat","Petugas menjelaskan dosis dan cara penggunaan obat","Petugas menjelaskan waktu penggunaan obat","Petugas menjelaskan lama penggunaan obat bila diperlukan","Petugas menjelaskan hal yang perlu diperhatikan selama menggunakan obat","Petugas memberikan kesempatan kepada pasien untuk bertanya","Petugas melayani pasien dengan ramah","Petugas berkomunikasi dengan sopan","Petugas mendengarkan pertanyaan/keluhan pasien","Petugas memberikan penjelasan dengan bahasa yang mudah dipahami","Petugas memberikan pelayanan tanpa membeda-bedakan pasien","Petugas mampu menjawab pertanyaan pasien mengenai obat","Petugas memberikan informasi obat yang meyakinkan","Petugas terlihat memahami pelayanan kefarmasian yang diberikan","Petugas memastikan pasien memahami cara menggunakan obat","Obat yang diresepkan tersedia di Puskesmas","Obat yang diterima dalam kondisi baik","Obat diberikan dalam kemasan yang sesuai","Pasien memperoleh obat sesuai kebutuhan terapinya","Ruang pelayanan kefarmasian bersih","Area tunggu pelayanan nyaman","Area pelayanan tertata dengan baik","Pasien dapat memperoleh pelayanan dengan mudah","Privasi pasien terjaga ketika berkonsultasi mengenai obat","Petugas memperhatikan kebutuhan pasien","Petugas membantu pasien ketika mengalami kesulitan","Pasien merasa aman menerima obat dari Puskesmas","Pelayanan kefarmasian secara keseluruhan sesuai harapan pasien","Pelayanan kefarmasian memberikan pengalaman yang baik bagi pasien","Pelayanan kefarmasian perlu terus ditingkatkan kualitasnya"];
let R=[],page="dash",edit=null,cutI=null,cutP=null;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function load(){try{R=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(R))R=[]}catch(e){R=[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(R))}
function avg(a){a=a.filter(v=>v!==null&&v!==undefined&&v!=="").map(Number).filter(Number.isFinite);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function fmt(v){return v==null?"—":Number(v).toLocaleString("id-ID",{minimumFractionDigits:2,maximumFractionDigits:2})}
function nvalid(r){return (r.i||[]).filter(v=>v!=null).length}
function complete(r){return nvalid(r)===40&&(r.p||[]).filter(v=>v!=null).length===40}
function attrMeans(i){return Q.map((q,j)=>avg(R.map(r=>(i?r.i:r.p)?.[j]??null)))}
function totals(){let im=attrMeans(true),pe=attrMeans(false);return {im,pe,gi:avg(im.filter(x=>x!=null)),gp:avg(pe.filter(x=>x!=null))}}
function nav(){let a=[["dash","▦ Dashboard"],["form","＋ Input IPA"],["list","☷ Data Responden"],["analysis","▤ Analisis IPA"],["backup","⇧ Ekspor & Cadangan"]];$("nav").innerHTML=a.map(x=>`<button class="${page===x[0]?"active":""}" data-p="${x[0]}">${x[1]}</button>`).join("");document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>go(b.dataset.p))}
function go(p){page=p;edit=null;nav();({dash:dash,form:form,list:list,analysis:analysis,backup:backup})[p]()}
function head(t,d){return `<div class="head"><h1>${t}</h1><div class="muted">${d}</div></div>`}
function met(l,v,h){return `<div class="metric"><small>${l}</small><b>${v}</b><div class="muted">${h}</div></div>`}
function dash(){let t=totals();$("content").innerHTML=head("Dashboard","Ringkasan pengumpulan data Importance–Performance Analysis.")+`<div class="grid">${met("Total responden",R.length,"Data lokal tersimpan")}${met("Kuesioner lengkap",R.filter(complete).length,"80 penilaian terisi")}${met("Rata-rata Importance",fmt(t.gi),"Rerata 40 atribut")}${met("Rata-rata Performance",fmt(t.gp),"Rerata 40 atribut")}</div><div class="card"><h2>Ringkasan dimensi</h2><div class="tablewrap"><table><thead><tr><th>Dimensi</th><th>Importance</th><th>Performance</th><th>Kesenjangan P−I</th></tr></thead><tbody>${D.map(d=>{let ix=Array.from({length:d[2]-d[1]+1},(_,k)=>d[1]-1+k),i=avg(R.flatMap(r=>ix.map(j=>r.i?.[j]??null))),p=avg(R.flatMap(r=>ix.map(j=>r.p?.[j]??null)));return `<tr><td>${esc(d[0])}</td><td>${fmt(i)}</td><td>${fmt(p)}</td><td>${i!=null&&p!=null?fmt(p-i):"—"}</td></tr>`}).join("")}</tbody></table></div></div><div class="notice"><b>Metode titik potong:</b> aplikasi memakai rata-rata keseluruhan atribut Importance dan Performance sebagai garis pembagi kuadran secara default. Ini dapat diubah pada menu Analisis IPA. Analisis hanya dihitung dari data yang dimasukkan, bukan data buatan.</div><div class="card"><button class="btn" onclick="go('form')">＋ Input responden baru</button></div>`}
function form(){let r=R.find(x=>x.id===edit),v=k=>esc(r?.[k]??""),ii=r?.i||Array(40).fill(null),pp=r?.p||Array(40).fill(null);let h=head(r?"Edit responden":"Input kuesioner IPA","Peneliti mengisi dua skor setiap atribut berdasarkan wawancara responden.");h+=`<form id="f"><div class="card"><h2>Identitas responden</h2><div class="formgrid"><div class="field"><label>Kode responden *</label><input name="code" required value="${v("code")}" placeholder="IPA001"></div><div class="field"><label>Nama Puskesmas *</label><input name="clinic" required value="${v("clinic")}"></div><div class="field"><label>Usia (tahun)</label><input name="age" type="number" min="0" max="120" value="${v("age")}"></div><div class="field"><label>Jenis kelamin</label><select name="sex"><option value="">Pilih</option>${["Laki-laki","Perempuan"].map(x=>`<option ${r?.sex===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Pendidikan terakhir</label><select name="edu"><option value="">Pilih</option>${["SD","SMP","SMA","Diploma","S1","S2/S3"].map(x=>`<option ${r?.edu===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Pekerjaan</label><select name="job"><option value="">Pilih</option>${["PNS","Swasta","Wiraswasta","IRT","Pelajar/Mahasiswa","Lainnya"].map(x=>`<option ${r?.job===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Frekuensi penggunaan layanan</label><select name="freq"><option value="">Pilih</option>${["Pertama kali","2–3 kali",">3 kali"].map(x=>`<option ${r?.freq===x?"selected":""}>${x}</option>`).join("")}</select></div></div></div><div class="card"><h2>Penilaian atribut pelayanan</h2><p class="muted">Importance: 1 sangat tidak penting, 2 tidak penting, 3 cukup penting, 4 penting, 5 sangat penting. Performance: 1 sangat tidak baik, 2 tidak baik, 3 cukup baik, 4 baik, 5 sangat baik.</p><div class="attrhead"><span>No.</span><span>Atribut pelayanan</span><span>Importance (1–5)</span><span>Performance (1–5)</span></div>${D.map(d=>`<div class="sect">${esc(d[0])}</div>${Array.from({length:d[2]-d[1]+1},(_,k)=>d[1]+k).map(i=>`<div class="attr"><div class="no">${i}</div><div class="desc">${esc(Q[i-1])}</div><div class="rating">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="i${i}" value="${n}" ${Number(ii[i-1])===n?"checked":""}>${n}</label>`).join("")}</div><div class="rating">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="p${i}" value="${n}" ${Number(pp[i-1])===n?"checked":""}>${n}</label>`).join("")}</div></div>`).join("")}`).join("")}<div class="notice" style="margin-top:14px">Atribut yang belum dinilai dibiarkan kosong. Jangan menebak jawaban responden atau mengisi otomatis.</div><div class="tools"><button class="btn">Simpan responden</button><button class="btn light" type="button" id="clear">Kosongkan</button><button class="btn light" type="button" onclick="go('list')">Kembali</button></div><div id="msg" class="muted"></div></div></form>`;$("content").innerHTML=h;$("f").onsubmit=ev=>{ev.preventDefault();let fd=new FormData(ev.target),g=k=>(fd.get(k)||"").toString().trim(),code=g("code");if(R.some(x=>x.code.toLowerCase()===code.toLowerCase()&&x.id!==edit)){$("msg").textContent="Kode responden sudah digunakan.";return}let i=Array.from({length:40},(_,j)=>fd.get("i"+(j+1))===null?null:Number(fd.get("i"+(j+1)))),p=Array.from({length:40},(_,j)=>fd.get("p"+(j+1))===null?null:Number(fd.get("p"+(j+1))));let obj={id:edit||("ipa"+Date.now()+Math.random().toString(36).slice(2,5)),code,clinic:g("clinic"),age:g("age")?Number(g("age")):null,sex:g("sex"),edu:g("edu"),job:g("job"),freq:g("freq"),i,p,updated:new Date().toISOString()};if(edit)R=R.map(x=>x.id===edit?obj:x);else R.push(obj);try{save();alert("Data tersimpan lokal.");go("list")}catch(e){$("msg").textContent="Penyimpanan gagal. Ekspor cadangan dan periksa penyimpanan browser."}};$("clear").onclick=()=>{if(confirm("Kosongkan formulir?")){edit=null;form()}}}
function list(){$("content").innerHTML=head("Data Responden","Cari, edit, lihat ringkasan, atau hapus data.");$("content").innerHTML+=`<div class="card"><div class="tools"><input id="search" placeholder="Cari kode / Puskesmas"><select id="fil"><option value="">Semua</option><option value="c">Lengkap</option><option value="i">Belum lengkap</option></select><button class="btn" onclick="go('form')">＋ Responden baru</button></div><div id="tbl"></div></div>`;$("search").oninput=draw;$("fil").onchange=draw;draw()}
function draw(){let q=($("search")?.value||"").toLowerCase(),f=$("fil")?.value||"",a=R.filter(r=>(r.code+" "+r.clinic).toLowerCase().includes(q)&&(f===""||(f==="c"?complete(r):!complete(r))));$("tbl").innerHTML=a.length?`<div class="tablewrap"><table><thead><tr><th>Kode</th><th>Puskesmas</th><th>Usia/JK</th><th>Penilaian terisi</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${a.map(r=>`<tr><td><b>${esc(r.code)}</b></td><td>${esc(r.clinic)}</td><td>${esc(r.age??"—")} / ${esc(r.sex||"—")}</td><td>${nvalid(r)} I, ${(r.p||[]).filter(v=>v!=null).length} P</td><td><span class="pill">${complete(r)?"Lengkap":"Belum lengkap"}</span></td><td><div class="tools"><button class="btn light" data-edit="${r.id}">Edit</button><button class="btn red" data-del="${r.id}">Hapus</button></div></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">Belum ada data responden.</div>';document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{edit=b.dataset.edit;page="form";nav();form()});document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{let r=R.find(x=>x.id===b.dataset.del);if(confirm("Hapus "+r.code+"?")){R=R.filter(x=>x.id!==r.id);save();draw()}})}
function analysis(){let t=totals(),ci=cutI??t.gi,cp=cutP??t.gp,rows=Q.map((q,j)=>({n:j+1,q,i:t.im[j],p:t.pe[j],fit:t.im[j]&&t.pe[j]?t.pe[j]/t.im[j]*100:null,quad:t.im[j]==null||t.pe[j]==null?"Belum cukup data":t.im[j]>=ci?(t.pe[j]>=cp?"II":"I"):(t.pe[j]>=cp?"IV":"III")}));let qname={"I":"I – Prioritas utama","II":"II – Pertahankan","III":"III – Prioritas relatif rendah","IV":"IV – Evaluasi efisiensi"};$("content").innerHTML=head("Analisis IPA","Rata-rata atribut, tingkat kesesuaian, dan klasifikasi kuadran.")+`<div class="grid">${met("Rata-rata Importance",fmt(t.gi),"Titik potong default")}${met("Rata-rata Performance",fmt(t.gp),"Titik potong default")}${met("Tingkat kesesuaian keseluruhan",t.gi&&t.gp?fmt(t.gp/t.gi*100)+"%":"—","Rerata P dibagi rerata I")}${met("Atribut dengan data",rows.filter(r=>r.i!=null&&r.p!=null).length+"/40","Memiliki dua skor")}</div><div class="card"><h2>Titik potong kuadran</h2><p class="muted">Default: rata-rata keseluruhan 40 atribut. Anda dapat mengubahnya jika metode penelitian menetapkan titik potong berbeda.</p><div class="formgrid"><div class="field"><label>Garis Importance</label><input id="cutI" type="number" min="1" max="5" step=".01" value="${ci==null?"":ci}"></div><div class="field"><label>Garis Performance</label><input id="cutP" type="number" min="1" max="5" step=".01" value="${cp==null?"":cp}"></div></div><button class="btn" id="apply">Terapkan titik potong</button></div><div class="card"><h2>Ringkasan kuadran</h2><div class="quadrants">${["I","II","III","IV"].map((q,k)=>`<div class="quad ${["q1","q2","q3","q4"][k]}"><h3>${qname[q]}</h3><p>${({"I":"Importance tinggi, Performance rendah. Kandidat prioritas perbaikan.","II":"Importance tinggi, Performance tinggi. Pertahankan kinerja.","III":"Importance rendah, Performance rendah. Prioritas relatif rendah.","IV":"Importance rendah, Performance tinggi. Evaluasi penggunaan sumber daya."})[q]}</p><p style="margin-top:8px"><b>${rows.filter(r=>r.quad===q).length} atribut</b></p><p>${rows.filter(r=>r.quad===q).map(r=>r.n+". "+r.q).join("; ")||"Tidak ada atribut"}</p></div>`).join("")}</div></div><div class="card"><h2>Matriks IPA (Importance × Performance)</h2><div class="chart"><canvas id="plot" class="plot" width="800" height="500" aria-label="Matriks IPA"></canvas></div><div class="muted">Sumbu X = Importance; sumbu Y = Performance. Label menunjukkan nomor atribut. Titik potong ditandai garis putus-putus.</div></div><div class="card"><h2>Tabel analisis 40 atribut</h2><div class="tablewrap"><table><thead><tr><th>No.</th><th>Atribut</th><th>Importance</th><th>Performance</th><th>Kesesuaian (%)</th><th>Kuadran</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.n}</td><td>${esc(r.q)}</td><td>${fmt(r.i)}</td><td>${fmt(r.p)}</td><td>${fmt(r.fit)}</td><td>${esc(r.quad==="Belum cukup data"?r.quad:qname[r.quad])}</td></tr>`).join("")}</tbody></table></div></div><div class="notice">Klasifikasi kuadran adalah analisis deskriptif. Titik potong yang digunakan harus dinyatakan dalam metode penelitian. Tingkat kesesuaian keseluruhan ditampilkan sebagai rasio rerata performance terhadap rerata importance; nilai atribut dihitung dari rerata atribut masing-masing.</div>`;$("apply").onclick=()=>{let i=Number($("cutI").value),p=Number($("cutP").value);if(!(i>=1&&i<=5&&p>=1&&p<=5)){alert("Titik potong harus antara 1 dan 5.");return}cutI=i;cutP=p;analysis()};drawPlot(rows,ci,cp)}
function drawPlot(rows,ci,cp){let c=$("plot");if(!c)return;let ctx=c.getContext("2d"),w=c.width,h=c.height,l=60,r=25,t=25,b=55,px=x=>l+(x-1)/4*(w-l-r),py=y=>h-b-(y-1)/4*(h-t-b);ctx.clearRect(0,0,w,h);ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.strokeStyle="#dce4ee";ctx.lineWidth=1;for(let n=1;n<=5;n++){ctx.beginPath();ctx.moveTo(px(n),t);ctx.lineTo(px(n),h-b);ctx.stroke();ctx.beginPath();ctx.moveTo(l,py(n));ctx.lineTo(w-r,py(n));ctx.stroke();ctx.fillStyle="#65768c";ctx.font="12px system-ui";ctx.fillText(n,l-22,py(n)+4);ctx.fillText(n,px(n)-3,h-b+22)}ctx.strokeStyle="#b42318";ctx.setLineDash([7,5]);ctx.beginPath();ctx.moveTo(px(ci||3),t);ctx.lineTo(px(ci||3),h-b);ctx.stroke();ctx.beginPath();ctx.moveTo(l,py(cp||3));ctx.lineTo(w-r,py(cp||3));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle="#102b52";ctx.font="bold 12px system-ui";ctx.fillText("Importance →",w/2,h-12);ctx.save();ctx.translate(16,h/2);ctx.rotate(-Math.PI/2);ctx.fillText("Performance →",0,0);ctx.restore();rows.forEach(o=>{if(o.i==null||o.p==null)return;ctx.beginPath();ctx.fillStyle=o.quad==="I"?"#b42318":o.quad==="II"?"#18794e":o.quad==="III"?"#24517f":"#b7791f";ctx.arc(px(o.i),py(o.p),6,0,Math.PI*2);ctx.fill();ctx.fillStyle="#1a2b42";ctx.font="10px system-ui";ctx.fillText(o.n,px(o.i)+7,py(o.p)-5)})}
function backup(){$("content").innerHTML=head("Ekspor & Cadangan","Simpan dataset untuk analisis atau pindahkan data antarperangkat.")+`<div class="grid">${met("Responden",R.length,"Data lokal")}${met("Atribut",40,"Dua skor per atribut")}${met("Skor per responden",80,"40 Importance + 40 Performance")}${met("Dimensi",8,"Sesuai dokumen")}</div><div class="card"><h2>Ekspor data</h2><p class="muted">CSV berisi satu baris per responden dengan kolom I1–I40 dan P1–P40. JSON mencadangkan seluruh data agar dapat dipulihkan.</p><div class="tools"><button class="btn" id="csv">Unduh CSV</button><button class="btn gold" id="json">Unduh cadangan JSON</button></div></div><div class="card"><h2>Pulihkan JSON</h2><div class="field"><label>Pilih file cadangan</label><input id="file" type="file" accept=".json,application/json"></div><div class="tools"><button class="btn" id="replace">Ganti seluruh data</button><button class="btn gold" id="merge">Gabungkan data</button></div><div id="msg" class="muted"></div></div><div class="notice">Data ekspor mengandung informasi penelitian. Simpan secara aman dan batasi akses. Data browser dapat hilang jika penyimpanan situs dihapus.</div>`;$("csv").onclick=csv;$("json").onclick=json;$("replace").onclick=()=>restore("replace");$("merge").onclick=()=>restore("merge")}
function dl(name,txt,type){let u=URL.createObjectURL(new Blob([txt],{type})),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function cell(x){let s=String(x??"");if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function csv(){let cols=["id","code","puskesmas","age","sex","education","job","frequency",...Array.from({length:40},(_,i)=>"I"+(i+1)),...Array.from({length:40},(_,i)=>"P"+(i+1)),"created_or_updated"];let rows=R.map(r=>[r.id,r.code,r.clinic,r.age,r.sex,r.edu,r.job,r.freq,...Array.from({length:40},(_,i)=>r.i?.[i]??""),...Array.from({length:40},(_,i)=>r.p?.[i]??""),r.updated]);dl("data_ipa_puskesmas.csv","\ufeff"+[cols,...rows].map(row=>row.map(cell).join(",")).join("\r\n"),"text/csv;charset=utf-8")}
function json(){dl("cadangan_ipa_puskesmas.json",JSON.stringify({app:"IPA Puskesmas",version:1,records:R},null,2),"application/json")}
async function restore(mode){let f=$("file").files[0];if(!f){$("msg").textContent="Pilih file JSON terlebih dahulu.";return}try{let o=JSON.parse(await f.text()),a=Array.isArray(o)?o:o.records;if(!Array.isArray(a)||a.some(r=>!r.code||!Array.isArray(r.i)||r.i.length!==40||!Array.isArray(r.p)||r.p.length!==40))throw Error("Struktur file tidak sesuai.");if(mode==="replace"){if(!confirm("Ganti seluruh data lokal? Buat cadangan dahulu jika perlu."))return;R=a}else{let m=new Map(R.map(r=>[r.code.toLowerCase(),r]));a.forEach(r=>{if(!m.has(r.code.toLowerCase()))m.set(r.code.toLowerCase(),r)});R=[...m.values()]}save();$("msg").textContent="Pemulihan berhasil. Total responden: "+R.length}catch(e){$("msg").textContent="Gagal memulihkan: "+e.message}}
load();nav();dash();
</script></body></html>
